[project]
name = "todo-riselist"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.1",
  "python-dotenv>=1.0",
  "marshmallow>=3.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-flask>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]